<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cohete sencillo RA</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs>
    <a-marker preset="hiro">
      <!-- Cuerpo -->
      <a-cylinder position="0 0.6 0" radius="0.15" height="0.8" color="#d9d9d9"></a-cylinder>

      <!-- Punta -->
      <a-cone position="0 1.15 0" radius-bottom="0.15" height="0.35" color="#ff3b30"></a-cone>

      <!-- Ventana -->
      <a-sphere position="0 0.75 0.16" radius="0.05" color="#3a86ff"></a-sphere>

      <!-- Aleta izquierda -->
      <a-box position="-0.18 0.25 0" width="0.08" height="0.22" depth="0.12" color="#ff3b30"></a-box>

      <!-- Aleta derecha -->
      <a-box position="0.18 0.25 0" width="0.08" height="0.22" depth="0.12" color="#ff3b30"></a-box>

      <!-- Fuego -->
      <a-cone position="0 -0.05 0" radius-bottom="0.07" height="0.22" rotation="180 0 0" color="#ff9f0a"></a-cone>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
