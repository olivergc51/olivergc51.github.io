<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apellido_nombre_ra_02</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs>

  <!-- Luces -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" position="1 2 1" intensity="1"></a-light>

  <a-marker preset="hiro">

    <!-- Escala general para que se vea mejor -->
    <a-entity scale="2 2 2">

      <!-- Cuerpo -->
      <a-cylinder
        position="0 0.8 0"
        radius="0.15"
        height="0.8"
        color="#cccccc">
      </a-cylinder>

      <!-- Punta -->
      <a-cone
        position="0 1.4 0"
        radius-bottom="0.15"
        height="0.4"
        color="red">
      </a-cone>

      <!-- Ventana -->
      <a-sphere
        position="0 0.95 0.16"
        radius="0.05"
        color="blue">
      </a-sphere>

      <!-- Aleta izquierda -->
      <a-box
        position="-0.22 0.45 0"
        width="0.08"
        height="0.28"
        depth="0.12"
        color="red">
      </a-box>

      <!-- Aleta derecha -->
      <a-box
        position="0.22 0.45 0"
        width="0.08"
        height="0.28"
        depth="0.12"
        color="red">
      </a-box>

      <!-- Fuego -->
      <a-cone
        position="0 0.18 0"
        radius-bottom="0.07"
        height="0.22"
        rotation="180 0 0"
        color="orange">
      </a-cone>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
