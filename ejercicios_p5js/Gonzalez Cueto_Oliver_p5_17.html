<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
<script>

// Sol y luna
let xS, yS, dS, rS, vS
let xL, yL, dL, rL, vL

// Calendario
let dia, mes, año

// Stickman
let xP, yP, S, vP
let groundY
let vY, jumpV, g
let headY, shoulderY, hipY
let rHead, bodyL, armL, legL

// Disparo
let xD, yD, tD, vD
let disparoActivo

// Objetivo
let xO, yO, wO, hO, vO

// Obstáculo
let xB, yB, wB, hB, vB

// Puntos
let puntos

// Estado del juego
let gameOver



function setup() {
  createCanvas(1000, 600)

  // Sol
  dS = min(width, height) * 0.2
  rS = dS / 2
  xS = -rS
  yS = height / 4
  vS = width / 400

  // Luna
  dL = dS * 0.5
  rL = dL / 2
  xL = -width - rL
  yL = height / 3
  vL = vS

  // Calendario
  dia = 18
  mes = 12
  año = 2025

  // Suelo
  groundY = height * 0.8

  // Stickman
  S = 0.12 * min(width, height)
  xP = width * 0.25
  yP = groundY
  vP = width / 150

  vY = 0
  jumpV = -0.03 * height
  g = 0.0016 * height

  rHead = 0.20 * S
  bodyL = 0.60 * S
  armL = 0.45 * S
  legL = 0.55 * S

  // Disparo
  tD = min(width, height) * 0.03
  vD = height / 80
  disparoActivo = false

  // Objetivo
  wO = width * 0.08
  hO = height * 0.05
  yO = height * 0.25
  reiniciarObjetivo()

  // Obstáculo
  wB = 60
  hB = 40
  yB = groundY - hB
  reiniciarObstaculo()

  // Puntos
  puntos = 0

  // Estado
  gameOver = false
}



function draw() {

  // 1) Fondo + suelo
  if (xS <= width + rS) background(0, 150, 255)
  else background(10)

  noStroke()
  fill(20, 120, 40)
  rect(0, groundY, width, height - groundY)

  // 2) Sol y luna (dibujo)
  dibujarSol()
  dibujarLuna()

  // 3) Actualizaciones solo si NO hay game over
  if (gameOver == false) {

    // Sol y luna + calendario
    xS += vS
    xL += vL

    if (xS > 2 * width + rS) {
      xS = -rS
      xL = -width - rL
      dia++
      if (dia > 30) { dia = 1; mes++ }
      if (mes > 12) { mes = 1; año++ }
    }

    // Objetivo
    xO += vO
    if (xO > width + wO || xO < -wO) {
      reiniciarObjetivo()
    }

    // Disparo
    if (disparoActivo) {
      yD -= vD
      if (yD < 0) disparoActivo = false
    }

    // Impacto disparo–objetivo
    if (disparoActivo &&
        xD > xO && xD < xO + wO &&
        yD > yO && yD < yO + hO) {

      puntos = puntos + 1
      disparoActivo = false
      reiniciarObjetivo()
    }

    // Obstáculo
    xB += vB
    if (xB > width + wB || xB < -wB) {
      reiniciarObstaculo()
    }

    // Colisión stickman–obstáculo
    let wP = 30
    let hP = 70

    let pIzq = xP - wP / 2
    let pDer = xP + wP / 2
    let pArr = yP - hP
    let pAba = yP

    let bIzq = xB
    let bDer = xB + wB
    let bArr = yB
    let bAba = yB + hB

    if (pDer > bIzq && pIzq < bDer &&
        pAba > bArr && pArr < bAba) {
      gameOver = true
    }

    // Stickman
    actualizarStickman()
  }

  // 4) Dibujar elementos
  dibujarObjetivo()
  if (disparoActivo) dibujarDisparo()
  dibujarObstaculo()
  dibujarStickman()

  // 5) HUD
  dibujarCalendario()
  dibujarPuntos()

  // 6) Game Over
  if (gameOver == true) {
    dibujarGameOver()
  }
}



// LÓGICA

function keyPressed() {

  if (gameOver) return

  if (keyCode === UP_ARROW && yP === groundY) {
    vY = jumpV
  }

  if (key === ' ' && !disparoActivo) {
    xD = xP
    yD = shoulderY
    disparoActivo = true
  }
}



function actualizarStickman() {

  if (keyIsDown(LEFT_ARROW)) xP -= vP
  if (keyIsDown(RIGHT_ARROW)) xP += vP

  xP = constrain(xP, 0, width)

  vY += g
  yP += vY
  if (yP > groundY) {
    yP = groundY
    vY = 0
  }

  hipY = yP - legL
  shoulderY = hipY - bodyL
  headY = shoulderY - rHead
}

function reiniciarObjetivo() {
  let dir = random([-1, 1])
  vO = dir * random(width / 300, width / 150)
  xO = dir === 1 ? -wO : width + wO
}

function reiniciarObstaculo() {
  let dir = random([-1, 1])
  vB = dir * random(width / 200, width / 120)
  xB = dir === 1 ? -wB : width + wB
}



// DIBUJO

function dibujarSol() {
  noStroke()
  fill(245, 234, 10)
  circle(xS, yS, dS)
}

function dibujarLuna() {
  noStroke()
  fill(200)
  circle(xL, yL, dL)
}

function dibujarObjetivo() {
  fill(255, 0, 200)
  rect(xO, yO, wO, hO, 10)
}

function dibujarDisparo() {
  fill(230)
  circle(xD, yD, tD)
}

function dibujarObstaculo() {
  fill(120)
  rect(xB, yB, wB, hB)
}

function dibujarStickman() {
  stroke(255, 40, 0)
  strokeWeight(0.06 * S)
  noFill()

  circle(xP, headY, 2 * rHead)
  line(xP, shoulderY, xP, hipY)

  line(xP - 0.25 * S, shoulderY, xP + 0.25 * S, shoulderY)
  line(xP - 0.25 * S, shoulderY, xP - 0.25 * S, shoulderY + armL)
  line(xP + 0.25 * S, shoulderY, xP + 0.25 * S, shoulderY + armL)

  line(xP, hipY, xP - 0.18 * S, yP)
  line(xP, hipY, xP + 0.18 * S, yP)
}

function dibujarCalendario() {
  noStroke()
  fill(xS <= width + rS ? 0 : 255)
  textSize(20)
  text("Fecha: (" + dia + ") (" + mes + ") (" + año + ")", 10, 25)
}

function dibujarPuntos() {
  noStroke()
  fill(255)
  textSize(20)
  text("Puntos: " + puntos, 10, 50)
}

function dibujarGameOver() {
  fill(255, 0, 0)
  textSize(50)
  textAlign(CENTER)
  text("GAME OVER", width / 2, height / 2)

  textSize(25)
  text("Puntos: " + puntos, width / 2, height / 2 + 40)
}

</script>
</body>
</html>
